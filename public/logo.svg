<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for 3D effect -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cccccc;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#999999;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- Shape gradients -->
    <radialGradient id="periwinkleGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e6e6fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d8d8f0;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="lavenderGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e6e6fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4d4f0;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="yellowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fffacd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0c0;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="coralGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffb6c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0a0a0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="80" fill="#e6f3ff" rx="10"/>
  
  <!-- Abstract shapes with 3D effect -->
  <!-- Large periwinkle blob -->
  <ellipse cx="100" cy="40" rx="35" ry="25" fill="url(#periwinkleGradient)" 
           filter="drop-shadow(2px 2px 3px rgba(0,0,0,0.1))"/>
  
  <!-- Top left lavender shape -->
  <ellipse cx="75" cy="25" rx="12" ry="8" fill="url(#lavenderGradient)"
           filter="drop-shadow(1px 1px 2px rgba(0,0,0,0.1))"/>
  
  <!-- Top right yellow crescent -->
  <path d="M 110 20 Q 140 15 150 30 Q 145 40 130 35 Q 120 30 110 20" 
        fill="url(#yellowGradient)" 
        filter="drop-shadow(1px 1px 2px rgba(0,0,0,0.1))"/>
  
  <!-- Bottom coral crescent -->
  <path d="M 120 45 Q 150 50 160 60 Q 155 70 140 65 Q 125 60 120 45" 
        fill="url(#coralGradient)" 
        filter="drop-shadow(1px 1px 2px rgba(0,0,0,0.1))"/>
  
  <!-- Bottom right lavender shape -->
  <ellipse cx="130" cy="55" rx="8" ry="6" fill="url(#lavenderGradient)"
           filter="drop-shadow(1px 1px 2px rgba(0,0,0,0.1))"/>
  
  <!-- MOODZERA text with 3D effect -->
  <!-- Text shadow -->
  <text x="100" y="48" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="16" font-weight="bold" fill="url(#shadowGradient)">
    MOODZERA
  </text>
  
  <!-- Main text -->
  <text x="100" y="46" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="16" font-weight="bold" fill="url(#textGradient)">
    MOODZERA
  </text>
</svg> 