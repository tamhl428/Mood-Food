<svg width="400" height="160" viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for 3D effect -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cccccc;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#999999;stop-opacity:0.2" />
    </linearGradient>
    
    <!-- Shape gradients -->
    <radialGradient id="periwinkleGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e6e6fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d8d8f0;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="lavenderGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e6e6fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4d4f0;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="yellowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fffacd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0c0;stop-opacity:1" />
    </radialGradient>
    
    <radialGradient id="coralGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffb6c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0a0a0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Abstract shapes with 3D effect -->
  <!-- Large periwinkle blob (main shape) -->
  <ellipse cx="200" cy="80" rx="70" ry="50" fill="url(#periwinkleGradient)" 
           filter="drop-shadow(3px 3px 5px rgba(0,0,0,0.15))"/>
  
  <!-- Top left lavender shape -->
  <ellipse cx="150" cy="50" rx="24" ry="16" fill="url(#lavenderGradient)"
           filter="drop-shadow(2px 2px 3px rgba(0,0,0,0.1))"/>
  
  <!-- Top right yellow crescent -->
  <path d="M 220 40 Q 280 30 300 60 Q 290 80 260 70 Q 240 60 220 40" 
        fill="url(#yellowGradient)" 
        filter="drop-shadow(2px 2px 3px rgba(0,0,0,0.1))"/>
  
  <!-- Bottom coral crescent -->
  <path d="M 240 90 Q 300 100 320 120 Q 310 140 280 130 Q 250 120 240 90" 
        fill="url(#coralGradient)" 
        filter="drop-shadow(2px 2px 3px rgba(0,0,0,0.1))"/>
  
  <!-- Bottom right lavender shape -->
  <ellipse cx="260" cy="110" rx="16" ry="12" fill="url(#lavenderGradient)"
           filter="drop-shadow(2px 2px 3px rgba(0,0,0,0.1))"/>
  
  <!-- MOODZERA text with 3D effect -->
  <!-- Text shadow -->
  <text x="200" y="96" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="32" font-weight="bold" fill="url(#shadowGradient)">
    MOODZERA
  </text>
  
  <!-- Main text -->
  <text x="200" y="92" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="32" font-weight="bold" fill="url(#textGradient)">
    MOODZERA
  </text>
</svg> 