<svg width="140" height="50" viewBox="0 0 140 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Main logo circle -->
  <circle cx="25" cy="25" r="20" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- Food emoji -->
  <text x="25" y="32" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="white">🍽️</text>
  
  <!-- Text with modern typography -->
  <text x="55" y="18" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F2937">Mood</text>
  <text x="55" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3B82F6">Food</text>
  
  <!-- Decorative elements -->
  <circle cx="120" cy="15" r="2" fill="#3B82F6" opacity="0.6"/>
  <circle cx="125" cy="25" r="1.5" fill="#6366F1" opacity="0.4"/>
  <circle cx="118" cy="35" r="1" fill="#3B82F6" opacity="0.3"/>
</svg> 